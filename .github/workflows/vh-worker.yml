name: VH Online Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque build job identifier"
        required: true
        type: string
      python_version:
        description: "Requested Python major.minor version (e.g. 3.13)"
        required: true
        type: string
        default: "3.13"
      processing_mode:
        description: "Audited processing mode"
        required: true
        type: choice
        options:
          - source_obfuscate
          - bytecode_pack
          - cython_build
          - pyinstaller_build
          - embed_build

permissions:
  contents: read
  actions: write

concurrency:
  group: vh-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process-job:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VH_APP_URL: ${{ secrets.VH_APP_URL }}
      WORKER_AUTH_SECRET: ${{ secrets.WORKER_AUTH_SECRET }}
      VH_JOB_ID: ${{ inputs.job_id }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Validate runner configuration
        env:
          HAS_SRC_REPO: ${{ secrets.VH_SRC_REPO != '' }}
          HAS_SRC_TOKEN: ${{ secrets.SRC_READ_TOKEN != '' }}
          HAS_APP_URL: ${{ secrets.VH_APP_URL != '' }}
          HAS_WORKER_SECRET: ${{ secrets.WORKER_AUTH_SECRET != '' }}
        run: |
          if [ "$HAS_SRC_REPO" != "true" ] || [ "$HAS_SRC_TOKEN" != "true" ] || [ "$HAS_APP_URL" != "true" ] || [ "$HAS_WORKER_SECRET" != "true" ]; then
            echo "Runner secrets are incomplete. Required: VH_SRC_REPO, SRC_READ_TOKEN, VH_APP_URL, WORKER_AUTH_SECRET."
            exit 1
          fi

      - name: Prepare workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ secrets.VH_SRC_REPO }}
          ref: ${{ secrets.VH_SRC_REF || 'main' }}
          token: ${{ secrets.SRC_READ_TOKEN }}
          sparse-checkout: |
            worker
            vh-core
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"
          cache-dependency-path: "worker/requirements.txt"

      - name: Cache native sysroot
        if: inputs.processing_mode == 'cython_build' || inputs.processing_mode == 'embed_build'
        uses: actions/cache@v4
        with:
          path: /tmp/vh-termux-sysroot
          key: vh-termux-sysroot-v1-${{ runner.os }}
          restore-keys: |
            vh-termux-sysroot-v1-

      - name: Verify exact runtime version
        run: |
          python3 -c "import sys; v=f'{sys.version_info.major}.{sys.version_info.minor}'; assert v == '${{ inputs.python_version }}', f'Expected ${{ inputs.python_version }}, got {v}'"

      - name: Install runner dependencies
        run: |
          python3 -m pip install -q --disable-pip-version-check --prefer-binary -r worker/requirements.txt

      - name: Prepare native build toolchain
        if: inputs.processing_mode == 'cython_build' || inputs.processing_mode == 'pyinstaller_build' || inputs.processing_mode == 'embed_build'
        run: |
          if [ "${{ inputs.processing_mode }}" = "cython_build" ] || [ "${{ inputs.processing_mode }}" = "embed_build" ]; then
            if ! command -v gcc >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gcc
            fi
          fi
          if [ "${{ inputs.processing_mode }}" = "cython_build" ]; then
            python3 -m pip install -q --disable-pip-version-check --prefer-binary "cython>=3.2,<3.3"
          fi
          if [ "${{ inputs.processing_mode }}" = "pyinstaller_build" ]; then
            python3 -m pip install -q --disable-pip-version-check --prefer-binary pyinstaller==6.12.0
          fi

      - name: Execute isolated build
        run: |
          python3 worker/run_job.py

      - name: Clean workspace & previous completed runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          rm -rf worker vh-core
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ.get("GH_TOKEN", "")
          repo = os.environ.get("REPO_SLUG", "")
          current_id = str(os.environ.get("CURRENT_RUN_ID", ""))
          if not token or not repo:
              raise SystemExit(0)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?status=completed&per_page=100",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
          except Exception as exc:
              print(f"Cleanup skipped: {exc}")
              raise SystemExit(0)

          deleted = 0
          for run in data.get("workflow_runs", []):
              rid = str(run.get("id", ""))
              if not rid or rid == current_id:
                  continue
              del_req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{rid}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(del_req, timeout=15):
                      deleted += 1
              except Exception:
                  pass
          print(f"Cleaned {deleted} previous completed run(s).")
          PY
